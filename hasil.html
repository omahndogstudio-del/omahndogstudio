<head>

    <script>

    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
        else { document.documentElement.classList.remove('dark'); localStorage.setItem('theme', 'light'); }
    </script>

    <meta name="cp-page" content="client">

    <script src="theme.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }

        /* Rangka foto: tinggi sudah dipesan dari rasio asli, jadi halaman tidak melompat saat foto masuk */
        .ph { position: relative; overflow: hidden; background: #e2e8f0; border-radius: 10px; }
        .dark .ph { background: #1e293b; }
        .ph img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity .5s ease; }
        .ph img.on { opacity: 1; }

        @keyframes shimmer { 0% { background-position: -400px 0 } 100% { background-position: 400px 0 } }
        .ph::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
            background-size: 800px 100%; animation: shimmer 1.4s infinite linear;
        }
        .dark .ph::before { background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%); background-size: 800px 100%; }
        .ph.done::before { display: none; }

        /* ===== MODE SINEMATIK ===== */
        .film-item { margin: 0 0 3rem; opacity: 0; transform: translateY(24px); transition: opacity .7s ease, transform .7s ease; }
        .film-item.seen { opacity: 1; transform: none; }
        /* foto potret jadi lebih sempit dari kolom: ditengahkan agar tidak menempel ke kiri */
        .film-item .ph { max-height: 86vh; margin-left: auto; margin-right: auto; }
        .film-item .ph img { object-fit: contain; background: transparent; }
        @media (max-width: 767px) { .film-item { margin-bottom: 2rem; } }

        /* ===== MODE MOSAIK =====
           Foto landscape memakai dua kolom, potret satu kolom, sehingga ubinnya beragam.
           grid-auto-flow: dense menutup celah yang tersisa. */
        #gridView { display: grid; grid-template-columns: repeat(2, 1fr); column-gap: 10px; row-gap: 0; grid-auto-rows: 4px; grid-auto-flow: row dense; }
        @media (min-width: 640px) { #gridView { grid-template-columns: repeat(3, 1fr); column-gap: 12px; } }
        @media (min-width: 1024px) { #gridView { grid-template-columns: repeat(4, 1fr); } }
        .grid-item { cursor: zoom-in; margin: 0 0 10px; }
        @media (min-width: 640px) { .grid-item { margin-bottom: 12px; } }
        .grid-item.wide { grid-column: span 2; }
        .grid-item .ph { height: 100%; transition: transform .3s ease; }
        @media (hover: hover) { .grid-item:hover .ph { transform: scale(1.015); } }

        /* Teks di atas foto: judul + nomor, dengan gradasi gelap agar tetap terbaca */
        .tile-ov {
            position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
            padding: 26px 14px 12px; pointer-events: none; color: #fff;
            background: linear-gradient(to top, rgba(2,6,23,.88) 0%, rgba(2,6,23,.42) 48%, rgba(2,6,23,0) 100%);
        }
        .tile-ov h3 { font-size: 13px; font-weight: 500; line-height: 1.25; letter-spacing: .01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .tile-ov p { font-size: 9px; letter-spacing: .16em; text-transform: uppercase; opacity: .72; margin-top: 3px; }
        @media (min-width: 640px) {
            .tile-ov { padding: 32px 16px 14px; }
            .tile-ov h3 { font-size: 16px; }
            .tile-ov p { font-size: 10px; }
        }

        /* ===== SAMPUL ===== */
        #coverImg { transform: scale(1.08); transition: opacity 1.2s ease, transform 7s ease-out; opacity: 0; }
        #coverImg.on { opacity: 1; transform: scale(1); }
        @keyframes nudge { 0%,100% { transform: translateY(0) } 50% { transform: translateY(7px) } }
        .nudge { animation: nudge 1.8s ease-in-out infinite; }

        .seg-on { background: var(--acc, #2563eb); color: var(--acct, #fff); }
    </style>
</head>

<script src="pengaturan.js"></script>
<script>
// =====================================================================
// GALERI HASIL EDIT - halaman presentasi (tanpa seleksi, tanpa watermark)
// Link dibuat admin di generatorLink (mode "Link Hasil") -> hasil.html?c=KODE
// =====================================================================
const state = { code: '', name: '', folderId: '', photos: [], mode: 'film', idx: 0 };
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const serverUrl = () => (typeof CONFIG_APP !== 'undefined' && CONFIG_APP.urlServer) ? String(CONFIG_APP.urlServer).trim() : '';

// Apps Script tidak mendukung preflight CORS: POST text/plain, cadangan lewat GET
async function serverCall(payload, timeoutMs = 20000) {
    const base = serverUrl();
    const attempt = async (viaGet) => {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), timeoutMs);
        try {
            const res = viaGet
                ? await fetch(base + (base.includes('?') ? '&' : '?') + new URLSearchParams(Object.assign({}, payload, { _t: Date.now() })), { signal: ctrl.signal })
                : await fetch(base, { method: 'POST', body: JSON.stringify(payload), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, signal: ctrl.signal });
            return await res.json();
        } finally { clearTimeout(timer); }
    };
    try { return await attempt(false); } catch (e) {
        if (e && e.name === 'AbortError') throw e;
        return await attempt(true);
    }
}

function showAlert(msg, type = 'success') {
    const box = document.getElementById('alertBox');
    document.getElementById('alertText').textContent = msg;
    document.getElementById('alertIcon').className = type === 'error'
        ? 'fa-solid fa-circle-exclamation text-red-400 text-lg'
        : 'fa-solid fa-circle-check text-green-400 text-lg';
    box.classList.remove('-translate-y-32', 'opacity-0');
    clearTimeout(window.__alertT);
    window.__alertT = setTimeout(() => box.classList.add('-translate-y-32', 'opacity-0'), 3000);
}

function toggleDarkMode() {
    const dark = document.documentElement.classList.toggle('dark');
    try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
    document.querySelector('#darkModeBtn i').className = dark ? 'fa-solid fa-sun text-slate-600 dark:text-slate-300' : 'fa-solid fa-moon text-slate-600 dark:text-slate-300';
}
window.updateDarkModeIcon = (dark) => {
    const i = document.querySelector('#darkModeBtn i');
    if (i) i.className = (dark ? 'fa-solid fa-sun' : 'fa-solid fa-moon') + ' text-slate-600 dark:text-slate-300';
};

// ---------- Pengaturan studio (nama, logo, tema, API key) ----------
const LOGO_CACHE = 'cp_logo_v1';
function applySettings(st) {
    if (!st || typeof CONFIG_APP === 'undefined') return;
    if (st.namaVendor) CONFIG_APP.namaVendor = st.namaVendor;
    if (st.whatsappAdmin) CONFIG_APP.whatsappAdmin = st.whatsappAdmin;
    if (st.googleApiKey) CONFIG_APP.googleApiKey = st.googleApiKey;
    if (typeof Theme !== 'undefined') Theme.apply(st.tema || '', true);

    const name = CONFIG_APP.namaVendor || 'Studio Foto';
    const set = (id, txt) => { const el = document.getElementById(id); if (el) el.textContent = txt; };
    set('headerVendorName', name);
    set('footerVendorName', name);
    set('coverVendor', name);
    document.title = 'Galeri Hasil - ' + name;
    ensureLogo(st.logoVersion || '');
}

function setLogo(uri) {
    const on = !!uri;
    [['headerLogoBox', 'headerLogo', 'flex'], ['coverLogoBox', 'coverLogo', 'block']].forEach(([boxId, imgId, disp]) => {
        const box = document.getElementById(boxId), img = document.getElementById(imgId);
        if (!box || !img) return;
        if (on) { img.src = uri; box.classList.remove('hidden'); box.classList.add(disp); }
        else { box.classList.add('hidden'); box.classList.remove(disp); }
    });
    const hi = document.getElementById('headerIcon');
    if (hi) hi.classList.toggle('hidden', on);
    const nb = document.getElementById('headerNameBox');
    if (nb) { nb.classList.toggle('hidden', on); nb.classList.toggle('sm:block', on); }
}

function ensureLogo(version) {
    let cache = null;
    try { cache = JSON.parse(localStorage.getItem(LOGO_CACHE) || 'null'); } catch (e) {}
    if (!version) { setLogo(''); return; }
    if (cache && cache.v === version && cache.data) { setLogo(cache.data); return; }
    serverCall({ action: 'logo' }).then(res => {
        if (res && res.ok && res.logo && res.version === version) {
            try { localStorage.setItem(LOGO_CACHE, JSON.stringify({ v: version, data: res.logo })); } catch (e) {}
            setLogo(res.logo);
        }
    }).catch(() => {});
}

// ---------- Daftar foto dari Google Drive ----------
async function fetchDriveJson(url, tries = 3) {
    let lastErr;
    for (let i = 0; i < tries; i++) {
        try {
            const res = await fetch(url);
            const data = await res.json().catch(() => ({}));
            if (res.ok) return data;
            const err = new Error((data.error && data.error.message) || ('HTTP ' + res.status));
            err.status = res.status;
            if (!(res.status === 429 || res.status >= 500)) throw err;
            lastErr = err;
        } catch (e) {
            if (e.status && !(e.status === 429 || e.status >= 500)) throw e;
            lastErr = e;
        }
        if (i < tries - 1) await sleep(900 * (i + 1) * (i + 1));
    }
    throw lastErr;
}

// Hanya foto di folder yang ditunjuk; sub-folder sengaja diabaikan agar halaman tetap satu alur
async function loadPhotos(folderId) {
    let files = [], pageToken = '';
    const q = encodeURIComponent(`'${folderId}' in parents and trashed=false`);
    const fields = encodeURIComponent('nextPageToken,files(id,name,mimeType,imageMediaMetadata(width,height))');
    do {
        let url = `https://www.googleapis.com/drive/v3/files?q=${q}&fields=${fields}&key=${CONFIG_APP.googleApiKey}&pageSize=1000`;
        if (pageToken) url += '&pageToken=' + encodeURIComponent(pageToken);
        const data = await fetchDriveJson(url);
        if (data.files) files = files.concat(data.files);
        pageToken = data.nextPageToken || '';
    } while (pageToken);

    return files
        .filter(f => f.mimeType !== 'application/vnd.google-apps.folder' && /^image\//.test(f.mimeType || ''))
        .map(f => ({
            id: f.id, name: f.name,
            w: (f.imageMediaMetadata && f.imageMediaMetadata.width) || 0,
            h: (f.imageMediaMetadata && f.imageMediaMetadata.height) || 0
        }))
        .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
}

// ---------- Tampilan foto ----------
const imgUrl = (id, w) => `https://lh3.googleusercontent.com/d/${id}=w${w}`;
const altUrl = (id, w) => `https://drive.google.com/thumbnail?id=${id}&sz=w${w}`;

// lh3 kadang membalas 429 saat banyak foto dimuat sekaligus: pindah sekali ke sumber cadangan
function imgFail(el, w) {
    if (el.dataset.alt) { el.closest('.ph').classList.add('done'); return; }
    el.dataset.alt = '1';
    el.src = altUrl(el.dataset.id, w);
}
function imgOk(el) { el.classList.add('on'); el.closest('.ph').classList.add('done'); }

const ratio = (p) => (p.w && p.h) ? `${p.w}/${p.h}` : '3/2';

function renderFilm() {
    document.getElementById('filmView').innerHTML = state.photos.map((p, i) => `
        <figure class="film-item" data-i="${i}">
            <div class="ph" style="aspect-ratio:${ratio(p)};cursor:zoom-in" onclick="openLightbox(${i})">
                <img loading="lazy" data-id="${p.id}" src="${imgUrl(p.id, 1600)}" alt="${esc(p.name)}" onload="imgOk(this)" onerror="imgFail(this,1600)">
            </div>
            <figcaption class="flex items-center justify-center gap-3 mt-3 px-1">
                <span class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 font-medium truncate">Foto ${i + 1}</span>
                <button onclick="downloadOne(${i},this)" class="shrink-0 px-3 py-2 text-xs font-bold bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-200 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition flex items-center gap-1.5">
                    <i class="fa-solid fa-download"></i><span class="hidden sm:inline">Unduh</span>
                </button>
            </figcaption>
        </figure>`).join('');
    observeFilm();
}

function renderGrid() {
    document.getElementById('gridView').innerHTML = state.photos.map((p, i) => {
        const wide = p.w && p.h && p.w > p.h;          // landscape -> ubin dua kolom
        const size = wide ? 1200 : 800;
        return `
        <figure class="grid-item${wide ? ' wide' : ''}" data-i="${i}" onclick="openLightbox(${i})">
            <div class="ph">
                <img loading="lazy" data-id="${p.id}" src="${imgUrl(p.id, size)}" alt="${esc(p.name)}" onload="imgOk(this)" onerror="imgFail(this,${size})">
                <div class="tile-ov">
                    <h3>Foto ${i + 1}</h3>
                </div>
            </div>
        </figure>`;
    }).join('');
    layoutGrid();
}

// Tinggi ubin mengikuti proporsi asli foto (tidak dipotong), memakai satuan baris 4px.
const GRID_UNIT = 4;
function layoutGrid() {
    const gv = document.getElementById('gridView');
    if (!gv.firstElementChild) return;
    if (!gv.firstElementChild.getBoundingClientRect().width) return;   // masih tersembunyi: hitung nanti
    const mb = parseFloat(getComputedStyle(gv.firstElementChild).marginBottom) || 0;
    for (const el of gv.children) {
        const p = state.photos[+el.dataset.i];
        const r = (p && p.w && p.h) ? p.h / p.w : 1.33;        // tanpa data ukuran: anggap potret
        const h = el.getBoundingClientRect().width * r;
        el.style.gridRowEnd = 'span ' + Math.max(1, Math.ceil((h + mb) / GRID_UNIT));
    }
}

let gridTimer = null;
window.addEventListener('resize', () => {
    if (state.mode !== 'grid') return;
    clearTimeout(gridTimer);
    gridTimer = setTimeout(layoutGrid, 150);
});

// Foto muncul perlahan saat masuk layar (kesan sinematik)
let filmObserver = null;
function observeFilm() {
    if (filmObserver) filmObserver.disconnect();
    filmObserver = new IntersectionObserver((entries) => {
        entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('seen'); filmObserver.unobserve(e.target); } });
    }, { rootMargin: '0px 0px -8% 0px' });
    document.querySelectorAll('.film-item').forEach(el => filmObserver.observe(el));
}

function setMode(m) {
    if (state.mode === m) return;
    state.mode = m;
    const film = m === 'film';
    document.getElementById('filmView').classList.toggle('hidden', !film);
    document.getElementById('gridView').classList.toggle('hidden', film);
    document.getElementById('segFilm').classList.toggle('seg-on', film);
    document.getElementById('segGrid').classList.toggle('seg-on', !film);
    document.getElementById('segFilm').classList.toggle('text-slate-600', !film);
    document.getElementById('segGrid').classList.toggle('text-slate-600', film);
    // dibuat sekali saja, tapi dibuat ulang bila isinya belum lengkap
    const gv = document.getElementById('gridView');
    if (!film) {
        if (gv.childElementCount !== state.photos.length) renderGrid();
        else layoutGrid();   // lebar kolom mungkin berubah saat mode mosaik tersembunyi
    }
    try { localStorage.setItem('cp_hasil_mode', m); } catch (e) {}
    document.getElementById('viewArea').scrollIntoView({ block: 'start' });
}

// ---------- Lightbox ----------
function openLightbox(i) {
    state.idx = i;
    const p = state.photos[i];
    const lb = document.getElementById('lightbox');
    document.getElementById('lbTitle').textContent = `Foto ${i + 1} dari ${state.photos.length}`;
    const img = document.getElementById('lbImg');
    img.dataset.id = p.id; delete img.dataset.alt;
    img.onerror = () => imgFailPlain(img);
    img.src = imgUrl(p.id, 1600);
    lb.classList.remove('hidden'); lb.classList.add('flex');
    setTimeout(() => lb.classList.replace('opacity-0', 'opacity-100'), 10);
    document.body.style.overflow = 'hidden';
}
function imgFailPlain(img) {
    if (img.dataset.alt) return;
    img.dataset.alt = '1';
    img.src = altUrl(img.dataset.id, 1600);
}
function closeLightbox() {
    const lb = document.getElementById('lightbox');
    lb.classList.replace('opacity-100', 'opacity-0');
    setTimeout(() => { lb.classList.add('hidden'); lb.classList.remove('flex'); document.body.style.overflow = 'auto'; }, 300);
}
function stepPhoto(d, e) {
    if (e) e.stopPropagation();
    const n = state.idx + d;
    if (n >= 0 && n < state.photos.length) openLightbox(n);
}
document.addEventListener('keydown', (e) => {
    const lb = document.getElementById('lightbox');
    if (!lb || lb.classList.contains('hidden')) return;
    if (e.key === 'Escape') closeLightbox();
    else if (e.key === 'ArrowRight') stepPhoto(1);
    else if (e.key === 'ArrowLeft') stepPhoto(-1);
});
let touchX = 0;
document.getElementById('lightbox').addEventListener('touchstart', (e) => { touchX = e.changedTouches[0].screenX; }, { passive: true });
document.getElementById('lightbox').addEventListener('touchend', (e) => {
    const d = e.changedTouches[0].screenX - touchX;
    if (Math.abs(d) > 60) stepPhoto(d < 0 ? 1 : -1);
}, { passive: true });

// ---------- Unduh (file asli, resolusi penuh) ----------
async function fetchOriginal(photo) {
    const url = `https://www.googleapis.com/drive/v3/files/${photo.id}?alt=media&key=${CONFIG_APP.googleApiKey}`;
    for (let attempt = 0; attempt < 2; attempt++) {
        try {
            const res = await fetch(url, { credentials: 'omit' });
            if (res.ok) return await res.blob();
        } catch (e) {}
        await sleep(2000);
    }
    throw new Error('download gagal');
}

function saveBlob(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
}

async function downloadOne(i, btn) {
    const p = state.photos[i];
    if (!p || (btn && btn.disabled)) return;
    const icon = btn && btn.querySelector('i');
    if (btn) { btn.disabled = true; icon.className = 'fa-solid fa-spinner fa-spin'; }
    try { saveBlob(await fetchOriginal(p), p.name); }
    catch (e) { showAlert('Gagal mengunduh foto. Coba lagi.', 'error'); }
    finally { if (btn) { btn.disabled = false; icon.className = 'fa-solid fa-download'; } }
}

async function downloadCurrent() {
    const btn = document.getElementById('lbDlBtn'), icon = document.getElementById('lbDlIcon');
    if (btn.disabled) return;
    btn.disabled = true; icon.className = 'fa-solid fa-spinner fa-spin';
    try { saveBlob(await fetchOriginal(state.photos[state.idx]), state.photos[state.idx].name); }
    catch (e) { showAlert('Gagal mengunduh foto. Coba lagi.', 'error'); }
    finally { btn.disabled = false; icon.className = 'fa-solid fa-download'; }
}

let dlJob = null;
async function downloadAll() {
    if (dlJob) { dlJob.cancel = true; return; }
    const photos = [...state.photos];
    if (!photos.length) return;
    if (!confirm(`Unduh ${photos.length} foto hasil edit?\n\nFile diunduh satu per satu. Jika browser bertanya, pilih "Izinkan" untuk unduhan berganda. Klik tombol lagi untuk membatalkan.`)) return;

    const job = dlJob = { cancel: false };
    const text = document.getElementById('dlAllText'), icon = document.getElementById('dlAllIcon');
    icon.className = 'fa-solid fa-spinner fa-spin';
    let ok = 0, fail = 0;
    for (let i = 0; i < photos.length && !job.cancel; i++) {
        text.textContent = `${i + 1}/${photos.length}`;
        try { saveBlob(await fetchOriginal(photos[i]), photos[i].name); ok++; }
        catch (e) { fail++; }
        await sleep(400);
    }
    dlJob = null;
    icon.className = 'fa-solid fa-download';
    text.textContent = 'Unduh Semua';
    showAlert(fail ? `${ok} foto diunduh, ${fail} gagal.` : `${ok} foto berhasil diunduh.`, fail ? 'error' : 'success');
}

// ---------- Mulai ----------
function fail(msg) {
    document.getElementById('loadingState').classList.add('hidden');
    document.getElementById('errorState').classList.remove('hidden');
    document.getElementById('errorText').textContent = msg;
    const wa = (typeof CONFIG_APP !== 'undefined' && CONFIG_APP.whatsappAdmin) ? CONFIG_APP.whatsappAdmin : '';
    if (wa) { const b = document.getElementById('errorWa'); b.href = 'https://wa.me/' + wa; b.classList.remove('hidden'); }
}

(async function init() {
    const code = (new URLSearchParams(location.search).get('c') || '').trim();
    if (!serverUrl()) return fail('Aplikasi belum terhubung ke server studio.');
    if (!code) return fail('Galeri hanya bisa dibuka melalui link khusus yang dikirim fotografer.');
    state.code = code;

    let res;
    try { res = await serverCall({ action: 'get', c: code }); }
    catch (e) { return fail('Tidak dapat terhubung ke server. Periksa koneksi internet Anda.'); }

    if (!res || !res.ok) return fail('Link ini tidak ditemukan atau sudah dihapus.');
    if (res.settings) applySettings(res.settings);

    const link = res.link || {};
    if (link.tipe === undefined) return fail('Server studio belum diperbarui untuk galeri hasil. Hubungi fotografer Anda.');
    // link seleksi punya watermark & proteksi sendiri: kembalikan ke halaman seleksi
    // "./" bukan "index.html": /index.html?c= diarahkan ke / dan ?c= ikut hilang
    if (link.tipe !== 'hasil') { location.replace('./?c=' + encodeURIComponent(code)); return; }
    if (link.closed) return fail('Galeri ini sudah ditutup oleh fotografer. Hubungi fotografer Anda untuk membukanya kembali.');
    if (!CONFIG_APP.googleApiKey) return fail('Galeri belum dikonfigurasi. Hubungi fotografer Anda.');

    state.name = link.name || '';
    state.folderId = link.folderId || '';
    if (!state.folderId) return fail('Folder foto belum diatur untuk link ini.');

    try { state.photos = await loadPhotos(state.folderId); }
    catch (e) { return fail('Gagal memuat foto dari Google Drive. Coba muat ulang halaman beberapa saat lagi.'); }
    if (!state.photos.length) return fail('Belum ada foto di galeri ini. Hubungi fotografer Anda.');

    document.getElementById('coverName').textContent = state.name || 'Galeri Anda';
    document.getElementById('coverCount').textContent = state.photos.length;
    const cover = document.getElementById('coverImg');
    cover.dataset.id = state.photos[0].id;
    cover.onload = () => cover.classList.add('on');
    cover.onerror = () => imgFailPlain(cover);
    cover.src = imgUrl(state.photos[0].id, 1600);

    renderFilm();

    document.getElementById('loadingState').classList.add('hidden');
    document.getElementById('topBar').classList.remove('hidden');
    document.getElementById('galleryWrap').classList.remove('hidden');
    document.getElementById('pageFooter').classList.remove('hidden');

    // mosaik adalah tampilan awal; dipanggil setelah galeri tampil karena saat
    // masih tersembunyi lebar kolom terbaca 0 dan ubin mosaik jadi gepeng
    let savedMode = null;
    try { savedMode = localStorage.getItem('cp_hasil_mode'); } catch (e) {}
    if (savedMode !== 'film') setMode('grid');
    updateDarkModeIcon(document.documentElement.classList.contains('dark'));
})();
</script>
